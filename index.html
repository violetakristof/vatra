<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vatra">
<title>Vatra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg:#F2EFE9; --card:#FFFFFF; --ink:#1F1B16; --mute:#6B645B; --line:#D9D4CB; --soft:#E9E6E0; --soft2:#C9C3B9; --green:#2F7A4B; --greenbg:#E6F2EA; --red:#B3261E; --amber:#D9A441; --amberbg:#FFF7E6; --amberink:#8A6413; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
  html { color-scheme: light; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .pick button, .chip { color: var(--ink); }
  .app { min-height:100vh; display:flex; flex-direction:column; }
  .top { padding:12px 20px 12px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line); }
  .toprow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:baseline; gap:12px; min-width:0; white-space:nowrap; overflow:hidden; }
  .brand span { overflow:hidden; text-overflow:ellipsis; }
  .topbtns { display:flex; gap:6px; align-items:center; flex:0 0 auto; }
  .ibtn { width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); font-size:18px; display:inline-flex; align-items:center; justify-content:center; padding:0; color:var(--ink); }
  .ibtn.lbl { width:auto; padding:0 12px; font-size:14px; font-weight:600; gap:5px; }
  .ibtn.shopurg { border-color:var(--red); color:var(--red); width:auto; padding:0 10px; font-weight:700; font-size:15px; }
  .tabs.seg { display:grid; grid-template-columns:repeat(var(--n), 1fr); width:100%; }
  .tabs.seg button { text-align:center; white-space:nowrap; }
  .people { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  .person { display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px 12px; border-radius:14px; background:var(--card); border:1.5px solid var(--line); min-height:52px; text-align:left; color:var(--ink); min-width:0; }
  .person .pn { display:flex; align-items:center; gap:7px; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .person .pn i { width:10px; height:10px; border-radius:50%; background:var(--soft2); display:inline-block; flex:0 0 auto; }
  .person .ps { font-size:12px; color:var(--mute); padding-left:17px; }
  .person.on .pn i { background:var(--green); }
  .person.me { border-color:var(--ink); }
  .person.hit { background:#FCE4EC; border-color:#F48FB1; }
  .person.off { opacity:.55; }
  .dshort { display:none; }
  .chip .fire { font-weight:600; color:var(--mute); font-size:13px; }
  .chip.hit { background:#F8BBD0; border-color:#F8BBD0; color:#5A1030; }
  .zoombtn { align-self:center; min-height:36px; padding:0 12px; border-radius:999px; border:1.5px solid var(--ink); background:var(--card); color:var(--ink); font-weight:700; font-size:15px; white-space:nowrap; touch-action:manipulation; }
  .mepill { align-self:center; min-height:36px; padding:0 14px; border-radius:999px; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:15px; white-space:nowrap; touch-action:manipulation; }
  .brand b { font-size:24px; letter-spacing:.02em; }
  .brand span { font-size:15px; color:var(--mute); }
  .tabs { display:flex; gap:4px; background:var(--soft); padding:4px; border-radius:999px; max-width:100%; box-sizing:border-box; overflow-x:auto; scrollbar-width:none; }
  .tabs button { border:0; background:transparent; color:var(--mute); padding:8px 14px; border-radius:999px; font-weight:600; font-size:14px; min-height:40px; }
  .tabs button.on { background:var(--ink); color:#fff; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line); min-height:40px; font-weight:600; font-size:14px; }
  .chip i { width:11px; height:11px; border-radius:50%; background:var(--soft2); display:inline-block; }
  .chip.on i { background:var(--green); }
  .chip.off { color:var(--mute); }
  .chip.me { outline:2px solid var(--ink); }
  .body { flex:1; display:flex; min-height:0; }
  .main { flex:1; min-width:0; padding:18px 20px 24px; display:flex; flex-direction:column; gap:18px; }
  .label { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin-bottom:8px; }
  .row { display:flex; align-items:stretch; gap:0; }
  .arrow { width:22px; display:flex; align-items:center; justify-content:center; color:#B5AFA5; font-size:20px; flex:0 0 22px; }
  .tile { flex:1 1 0; min-width:0; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; position:relative; }
  .tile .k { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .tile .n { font-size:26px; font-weight:700; line-height:1.1; }
  .tile .s { font-size:13px; color:var(--mute); }
  .tile .acts { margin-top:auto; display:flex; gap:8px; padding-top:8px; flex-wrap:wrap; }
  .tile.done { background:var(--greenbg); border-color:var(--green); }
  .tile.done .k { color:var(--green); }
  .tile.locked, .tile.future { background:var(--soft); border-style:dashed; border-color:var(--soft2); }
  .tile.locked .n, .tile.locked .k, .tile.locked .s, .tile.future .n, .tile.future .k, .tile.future .s { color:#8C857B; }
  .tile.overdue { border-color:var(--red); }
  .tile.overdue .k { color:var(--red); }
  .tile.passed, .tile.missed { background:var(--soft); }
  .li.missed { background:var(--soft); color:#8C857B; }
  .tile.auto { background:var(--greenbg); border-color:var(--green); }
  .tile.unassigned { border-style:dashed; }
  .tile.claim { background:var(--amberbg); border-color:var(--amber); }
  .tile.claim .k, .tile.claim .s { color:var(--amberink); }
  .tile.running { border-color:var(--ink); }
  .btn { min-height:44px; padding:0 14px; border-radius:10px; border:1.5px solid var(--ink); background:var(--ink); color:#fff; font-weight:600; font-size:14px; }
  .btn.ghost { background:var(--card); color:var(--ink); }
  .btn.quiet { background:var(--card); color:var(--mute); border-color:var(--line); }
  .btn.sm { min-height:36px; padding:0 10px; font-size:13px; }
  .grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  .zone { background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:76px; }
  .zone .n { font-size:20px; font-weight:700; }
  .zone.done { background:var(--greenbg); border-color:var(--green); }
  .zone.overdue { border-color:var(--red); }

  .small .k { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .small .n { font-size:18px; font-weight:700; }
  .small .s { font-size:12px; color:var(--mute); }
  .small.done { background:var(--greenbg); border-color:var(--green); }
  .small.claim { background:var(--amberbg); border-color:var(--amber); }
  .small.claim .k, .small.claim .s { color:var(--amberink); }
  .small.unassigned { border-style:dashed; }
  .small .acts { margin-top:6px; display:flex; gap:6px; }
  .redcol { width:220px; flex:0 0 220px; background:var(--red); color:#fff; padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
  .redcol .label { color:#fff; opacity:.85; }
  .redtile { background:#fff; color:var(--red); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .redtile .n { font-size:22px; font-weight:700; line-height:1.05; }
  .redtile .w { font-size:14px; font-weight:600; }
  .redtile .s { font-size:12px; opacity:.8; }
  .redtile .acts { margin-top:6px; }
  .redtile .btn { background:var(--red); border-color:var(--red); }
  .redcol .foot { margin-top:auto; font-size:12px; opacity:.85; line-height:1.4; }
  .sheet-bg { position:fixed; inset:0; background:rgba(31,27,22,.45); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .sheet-bg.on { display:flex; }
  .sheet { background:var(--card); width:min(560px, 100%); border-radius:18px 18px 0 0; padding:20px 20px 32px; display:flex; flex-direction:column; gap:12px; max-height:85vh; max-height:85dvh; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .sheet button { touch-action:manipulation; }
  .sheet .sticky { position:sticky; bottom:-32px; background:var(--card); padding:10px 0 4px; margin-bottom:-4px; display:flex; flex-direction:column; }
  .sheet h3 { margin:0; font-size:20px; }
  .sheet p { margin:0; color:var(--mute); font-size:15px; line-height:1.45; }
  .pick { display:flex; flex-wrap:wrap; gap:8px; }
  .pick button { min-height:44px; padding:0 16px; border-radius:10px; border:1.5px solid var(--line); background:var(--card); font-weight:600; }
  .pick button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .note { font-size:13px; color:var(--mute); }
  .list { display:flex; flex-direction:column; gap:8px; }
  .li { background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .li .n { font-weight:700; font-size:16px; }
  .li .s { font-size:12px; color:var(--mute); }
  .li.done { background:var(--greenbg); border-color:var(--green); }
  .xbtn { color:var(--red) !important; border-color:var(--red) !important; min-width:36px; padding:0 8px; }
  .li.cancelled, .tile.cancelled { background:var(--soft); opacity:.6; }
  .li.cancelled .n, .tile.cancelled .k { text-decoration:line-through; }
  .li.overdue { border-color:var(--red); }
  .li.locked, .li.future { background:var(--soft); color:#8C857B; }
  .banner { background:var(--amberbg); border:1px solid var(--amber); color:var(--amberink); border-radius:10px; padding:10px 14px; font-size:14px; }
  .center { display:flex; align-items:center; justify-content:center; min-height:60vh; padding:24px; }
  .who { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; max-width:520px; width:100%; display:flex; flex-direction:column; gap:14px; }
  .who h2 { margin:0; }
  @media (max-width: 760px) {
    .top { padding:10px 12px; gap:8px; }
    .brand b { font-size:20px; } .brand span { font-size:13px; }
    .dlong, .dshort { display:none !important; }
    .people { gap:5px; }
    .person { padding:6px 4px; min-height:46px; border-radius:12px; align-items:center; text-align:center; }
    .person .pn { font-size:13px; }
    .person .pn i { display:none; }
    .person .ps { padding-left:0; font-size:11px; }
    .person.on { border-color:var(--green); }
    .main { padding:14px; }
    .row { flex-direction:column; gap:10px; }
    .arrow { display:none; }
    .grid3, .grid4 { grid-template-columns:1fr 1fr; }
    .redcol { display:none; }
    .body { flex-direction:column; }
    .redrow { display:flex; }
  }
  .redrow { display:none; }
  .namebtn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-weight:700; border-radius:8px; padding:0 4px; margin-left:-4px; }
  .tile .namebtn { font-size:26px; line-height:1.1; }
  .zone .namebtn { font-size:20px; }
  .small .namebtn { font-size:18px; }
  .namebtn:hover, .namebtn:focus-visible { background:var(--soft); }
  .namebtn .caret { font-size:.55em; color:var(--mute); }
  .pick.big button { min-width:96px; min-height:56px; font-size:17px; padding:6px 14px; text-align:left; }
  .clrday { all:unset; cursor:pointer; font-size:10px; color:var(--mute); text-decoration:underline; align-self:flex-end; }

  .steps { list-style:none; margin:10px 0 2px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .steps li { display:flex; align-items:center; gap:12px; font-size:15px; line-height:1.3; }
  .steps .num { flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
  .steps li:last-child .num { background:var(--green); }

  .fx-daily { box-shadow: inset 5px 0 0 #3E74C9; }
  .fx-several { box-shadow: inset 5px 0 0 #2A9D8F; }
  .fx-weekly { box-shadow: inset 5px 0 0 #8A5CC9; }
  .fx-fortnight { box-shadow: inset 5px 0 0 #D0679A; }
  .fx-monthly { box-shadow: inset 5px 0 0 #D98A2B; }
  .ftag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:2px 0 1px; }
  .ftag.daily { color:#3E74C9; } .ftag.several { color:#2A9D8F; } .ftag.weekly { color:#8A5CC9; } .ftag.fortnight { color:#D0679A; } .ftag.monthly { color:#D98A2B; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11.5px; color:var(--mute); margin-top:14px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  body.pinkday, body.pinkday .main { background:#FCE4EC !important; transition:background .6s; }
  .pinkbar { background:linear-gradient(135deg,#F8BBD0,#F48FB1); color:#5A1030; font-weight:800; font-size:20px; padding:14px 16px; border-radius:14px; margin-bottom:12px; text-align:center; }
  .ninebar { background:#FFF1C9; border:1.5px solid #E8B64A; color:#6B4A00; border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .streaks { display:flex; flex-wrap:wrap; gap:6px; }
  .streaks .chip { padding:6px 10px; border-radius:999px; background:var(--soft); font-weight:600; font-size:14px; }
  .streaks .chip.hit { background:#F8BBD0; color:#5A1030; }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
  .confetti i { position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; animation:conf 2.6s ease-in forwards; }
  @keyframes conf { to { top:105vh; transform:translateX(30px) rotate(540deg); opacity:.7; } }
  .sheetclose { position:sticky; top:0; z-index:5; display:flex; justify-content:flex-end; margin:-4px 0 -36px; pointer-events:none; }
  .sheetclose button { pointer-events:auto; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .listsel { font:inherit; font-size:13px; padding:4px 6px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:110px; }
  .messbtn { white-space:nowrap; }
  #sheet > h3 { padding-right:110px; }
  .shoprow { cursor:pointer; align-items:center; gap:10px; -webkit-user-select:none; user-select:none; }
  .shoprow .chk { flex:0 0 26px; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; background:#fff; }
  .shoprow.overdue .chk { border-color:var(--red); }
  .shoprow .chk.on { background:#3E7A4F; border-color:#3E7A4F; }
  .pomo { font-variant-numeric:tabular-nums; white-space:nowrap; }

  .pace { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .sw { font-variant-numeric:tabular-nums; font-weight:700; font-size:13px; align-self:center; padding:4px 8px; border-radius:8px; background:var(--soft); }
  .sw.amber { background:#F6E3B8; color:#7A5200; }
  .sw.red { background:var(--red); color:#fff; }
  .swwarn { display:none; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; font-weight:600; color:var(--red); }
  .late { background:#FFF1E0 !important; border-color:#E8892B !important; box-shadow: inset 5px 0 0 #E8892B !important; }
  .late .k { color:#B35C00 !important; }
  /* Kitchen board (Mama, 8 Nov 00:32): zones first, big; Tonight chain with 🍅; the rest as chips */
  body.board .brand span { font-size:18px; font-weight:600; color:var(--ink); }
  body.board .streaks .chip { font-size:18px; padding:10px 16px; }
  body.board .pinkbar { font-size:26px; padding:18px; }
  .bzones { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; }
  .bzone { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:20px 20px 16px; display:flex; flex-direction:column; gap:10px; min-height:210px; position:relative; box-shadow:0 4px 14px rgba(31,27,22,.06); }
  .bzone .k { font-size:16px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
  .bzone .n, .bzone .namebtn { font-size:44px; font-weight:800; line-height:1; }
  .bzone .s { font-size:13px; color:var(--mute); }
  .bzone .dots { font-size:26px; letter-spacing:4px; color:var(--green); line-height:1; }
  .bzone .dots .o { color:var(--soft2); } .bzone .dots .x { color:var(--red); } .bzone .dots .t { color:var(--amber); }
  .bzone .acts { margin-top:auto; display:flex; align-items:center; gap:8px; padding-top:6px; flex-wrap:wrap; }
  .bzone .tick { font-size:24px; padding:14px 24px; border-radius:16px; }

  .bzone.done { background:var(--greenbg); border-color:var(--green); }
  .bzone.overdue { border-color:var(--red); }
  .bzone .messbtn { margin-left:auto; }

  .calmbar { background:var(--greenbg); border:1.5px solid var(--green); color:var(--green); border-radius:14px; padding:12px 16px; font-weight:700; font-size:16px; }
  .bstep.off { background:var(--soft); border-style:dashed; border-color:var(--soft2); opacity:.6; }
  .bstep { background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; min-height:110px; position:relative; }
  .bstep .k { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .bstep .n, .bstep .namebtn { font-size:22px; font-weight:800; line-height:1.1; }
  .bstep .s { font-size:12px; color:var(--mute); }
  .bstep .acts { margin-top:auto; display:flex; gap:8px; padding-top:8px; flex-wrap:wrap; align-items:center; }
  .bstep.done, .bstep.auto { background:var(--greenbg); border-color:var(--green); }
  .bstep.locked, .bstep.future { background:var(--soft); border-style:dashed; border-color:var(--soft2); opacity:.75; }

      for (const x of list) if (x.chore === "grandparents" && x.date === "2026-11-13") { x.person = "Sofia"; x.pin = true; x.fixed = true; } // Mama, 7 Nov 23:08
